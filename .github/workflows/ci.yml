name: CI

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ !startsWith(github.ref, 'refs/tags/') }}

env:
  GOFLAGS: -trimpath -buildvcs=false

jobs:
  checks:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Rebuild frontend and confirm committed assets match
        run: |
          npm --prefix frontend ci
          npm --prefix frontend test
          npm --prefix frontend run build
          git diff --exit-code -- assets/
          test -z "$(git status --porcelain assets/)"
      - name: Install GTK and WebKitGTK headers
        run: |
          sudo apt-get update
          sudo apt-get install -y libgtk-3-dev libwebkit2gtk-4.1-dev
      - name: Vet and test
        run: |
          go vet -tags "desktop,production,webkit2_41" ./...
          go test -tags "desktop,production,webkit2_41" ./...

  build-linux:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - name: Install GTK and WebKitGTK headers
        run: |
          sudo apt-get update
          sudo apt-get install -y libgtk-3-dev libwebkit2gtk-4.1-dev
      - name: Build
        run: |
          VERSION="${GITHUB_REF_NAME}"
          [[ "${GITHUB_REF}" == refs/tags/v* ]] || VERSION="dev-$(git rev-parse --short HEAD)"
          go build -tags "desktop,production,webkit2_41" -ldflags "-w -s" -o Atlas .
          tar -czf "Atlas-${VERSION}-linux-amd64.tar.gz" Atlas
      - uses: actions/upload-artifact@v4
        with:
          name: atlas-linux-amd64
          path: Atlas-*-linux-amd64.tar.gz
          if-no-files-found: error

  build-windows:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - name: Cross-compile for Windows
        env:
          GOOS: windows
          GOARCH: amd64
          CGO_ENABLED: "0"
        run: |
          VERSION="${GITHUB_REF_NAME}"
          [[ "${GITHUB_REF}" == refs/tags/v* ]] || VERSION="dev-$(git rev-parse --short HEAD)"
          go build -tags "desktop,production" -ldflags "-w -s -H windowsgui" -o Atlas.exe .
          zip "Atlas-${VERSION}-windows-amd64.zip" Atlas.exe
      - uses: actions/upload-artifact@v4
        with:
          name: atlas-windows-amd64
          path: Atlas-*-windows-amd64.zip
          if-no-files-found: error

  build-macos:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - name: Build and assemble Atlas.app
        run: |
          VERSION="${GITHUB_REF_NAME}"
          [[ "${GITHUB_REF}" == refs/tags/v* ]] || VERSION="dev-$(git rev-parse --short HEAD)"
          go build -tags "desktop,production" -ldflags "-w -s" -o Atlas .
          mkdir -p Atlas.app/Contents/MacOS
          cp Atlas Atlas.app/Contents/MacOS/Atlas
          cat > Atlas.app/Contents/Info.plist <<EOF
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict>
            <key>CFBundleExecutable</key><string>Atlas</string>
            <key>CFBundleIdentifier</key><string>dev.felinestatemachine.atlas</string>
            <key>CFBundleName</key><string>Atlas</string>
            <key>CFBundlePackageType</key><string>APPL</string>
            <key>CFBundleInfoDictionaryVersion</key><string>6.0</string>
            <key>CFBundleShortVersionString</key><string>${VERSION#v}</string>
            <key>LSMinimumSystemVersion</key><string>12.0</string>
            <key>NSHighResolutionCapable</key><true/>
          </dict>
          </plist>
          EOF
          ditto -c -k --keepParent Atlas.app "Atlas-${VERSION}-darwin-arm64.zip"
      - uses: actions/upload-artifact@v4
        with:
          name: atlas-darwin-arm64
          path: Atlas-*-darwin-arm64.zip
          if-no-files-found: error

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [checks, build-linux, build-windows, build-macos]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v5
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          PRERELEASE=""
          [[ "${GITHUB_REF_NAME}" == *-* ]] && PRERELEASE="--prerelease"
          gh release create "${GITHUB_REF_NAME}" dist/* \
            --title "Atlas ${GITHUB_REF_NAME}" \
            --generate-notes --verify-tag ${PRERELEASE}
