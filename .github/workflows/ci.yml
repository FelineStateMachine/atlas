# The enforcement job.
#
# Deliberately separate from release.yml, which links a native webview and so
# needs GTK and WebKitGTK headers on Linux, a macOS runner for the .app, and
# the seam built first. This one judges correctness on every push and pull
# request, and it holds one rule above all others: a gate that did not judge
# may not say PASS. `go test` is run through tools/testgate, which fails the
# run if any test skipped; there are no optional prerequisites, because every
# input a required test reads is committed to this repository or generated by
# the job itself.
#
# It runs on all three platforms. The tests compare bytes for a living —
# generated artifacts against committed ones — so a platform that rewrote a
# line ending or built a path with the wrong separator is caught here rather
# than by a user. `/.gitattributes` is the other half of that: LF in every
# working tree, corpus files never transformed at all.

name: CI

on:
  push:
    branches:
      - main
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  GOFLAGS: -buildvcs=false

jobs:
  test:
    name: test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      # One platform's failure is a finding about that platform, not a reason
      # to stop learning what the other two think.
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, macos-15, windows-2022]
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - uses: actions/setup-node@v4
        with:
          # Type stripping is on by default here, which is what lets the lanes
          # run their TypeScript tests with no build step.
          node-version: "24"
          cache: npm
          cache-dependency-path: package-lock.json

      # The TypeScript lanes install at the repository root as npm workspaces.
      # `--ignore-scripts` because nothing here has a postinstall worth running.
      - name: Install the TypeScript lanes' dependencies
        run: npm ci --ignore-scripts

      # A checkout that rewrote line endings would fail the byte comparisons
      # below with an unreadable diff. Say so here instead, in one line.
      - name: Confirm the working tree came through unmodified
        run: git diff --exit-code

      - name: Vet
        run: go vet ./...

      # Every Go test in the module, through the gate that refuses skips.
      # The race detector needs cgo and a C toolchain, so it runs where that
      # is free rather than nowhere.
      - name: Go tests
        run: go run ./tools/testgate ${{ matrix.os == 'ubuntu-24.04' && '-race' || '' }} ./...

      # Each lane's own gate: boundary rules, tsc at its strictest, and the
      # lane's test suite.
      - name: Analysis lane
        run: npm run --silent lane

      - name: Render lane
        run: npm run --silent seam-lane

      # The guardrails: the lane import matrix, hostenv purity, network
      # confinement, semconv discipline.
      - name: Depcheck
        run: go run ./tools/depcheck

  e2e:
    name: e2e (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04]
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Install the TypeScript lanes' dependencies
        run: npm ci --ignore-scripts

      - name: Install a browser
        run: npx playwright install --with-deps chromium

      # Builds the seam, packs the test registry from the committed corpus,
      # starts the real application over it and walks it in a real browser.
      # Every prerequisite is built right here, in this job: there is no
      # "not judged" outcome, only red and green.
      - name: End-to-end
        run: make test-e2e
