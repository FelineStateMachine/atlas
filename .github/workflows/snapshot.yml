# Snapshot builds one city's .atlas on a schedule and publishes it only when
# the city changed. It is reusable: a caller names the city and provides the
# state -- a capture archive committed to a branch of the calling repository --
# and this workflow crawls, composes, enriches, gates on the bundle's own
# content stamp, and publishes to the caller's releases. A city IT team runs
# their own copy in a private repository with their curation and their key;
# this repository's scheduler runs it over the public proof cities as the
# living test of the same path.
#
# PARKED (issue #5 §7, M7). The pipeline steps below are the clean room's --
# `atlas crawl|tiles|compose|enrich` in place of the archived tools/ programs
# -- but the ArcGIS/USGS crawler is the one crawler the rewrite has not built:
# `atlas crawl -source list` offers `ign` and nothing else, and docs/generate.md
# §3.2 says why (the city's archive was an input to the rewrite rather than
# something the lane could take). A run therefore fails at the crawl step, and
# the scheduler in snapshots.yml is dispatch-only until it does not.
#
# What unblocks it is one crawler under internal/generate/crawl, registered as
# `arcgis-hub`, fetching a curated city's hub layers and the two USGS national
# services by bounding box. Everything after it here is already the shipped
# path; the composition and enrichment of that archive are proven by the
# `bend-or` bundle fixture, which reproduces byte-identically (docs/generate.md
# §8).
name: Snapshot

on:
  workflow_call:
    inputs:
      city:
        description: "curated city slug, e.g. bend-or"
        required: true
        type: string
      atlas-ref:
        description: "atlas ref to build with"
        required: false
        type: string
        default: main
      state-branch:
        description: "branch of the calling repository holding the fmg-archive"
        required: false
        type: string
        default: snapshots

permissions:
  contents: write

env:
  CGO_ENABLED: "0"
  GOFLAGS: -trimpath -buildvcs=false

jobs:
  snapshot:
    runs-on: ubuntu-24.04
    steps:
      - name: Check out snapshot state
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.state-branch }}
          path: state
          # The state branch must exist; docs/snapshots.md shows the one-time
          # orphan-branch setup.

      - name: Check out atlas
        uses: actions/checkout@v4
        with:
          repository: FelineStateMachine/atlas
          ref: ${{ inputs.atlas-ref }}
          path: atlas

      # A city that should stay out of a public repository is carried by the
      # `atlas-ref` input: point it at a branch or fork whose curation table
      # names the city. The reference tree's habit of dropping a gitignored
      # companion file into the source package is not carried over -- the
      # clean room's table is a gate, and a gate that can be extended by a file
      # nobody reviews is not one (internal/generate/sources/arcgishub).

      - uses: actions/setup-go@v5
        with:
          go-version-file: atlas/go.mod
          cache-dependency-path: atlas/go.sum

      - name: Crawl
        working-directory: atlas
        run: |
          go run ./cmd/atlas crawl -archive ../state/fmg-archive \
            -source arcgis-hub "${{ inputs.city }}"

      - name: Compose and enrich
        working-directory: atlas
        run: |
          go run ./cmd/atlas tiles -archive ../state/fmg-archive -output build/tiles
          go run ./cmd/atlas compose -archive ../state/fmg-archive \
            -tiles build/tiles/index.json -bundles ../out
          go run ./cmd/atlas enrich -archive ../state/fmg-archive \
            -tiles build/tiles/index.json -bundles ../out

      - name: Gate on the stamp
        id: gate
        working-directory: out
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          FILE=$(ls ${{ inputs.city }}-*.atlas | sort | tail -1)
          echo "file=$FILE" >> "$GITHUB_OUTPUT"
          if gh release view "snapshot-${{ inputs.city }}" --repo "$GITHUB_REPOSITORY" \
               --json assets -q '.assets[].name' 2>/dev/null | grep -qx "$FILE"; then
            echo "unchanged: $FILE is already published"
            echo "changed=false" >> "$GITHUB_OUTPUT"
          else
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Commit the archive
        if: steps.gate.outputs.changed == 'true'
        working-directory: state
        run: |
          git config user.name "atlas-snapshot"
          git config user.email "snapshot@users.noreply.github.com"
          git add -A
          git diff --cached --quiet || git commit -m "snapshot ${{ inputs.city }}: ${{ steps.gate.outputs.file }}"
          git push

      - name: Publish
        if: steps.gate.outputs.changed == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          FILE="${{ steps.gate.outputs.file }}"
          RELEASE="snapshot-${{ inputs.city }}"
          if ! gh release view "$RELEASE" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release create "$RELEASE" --repo "$GITHUB_REPOSITORY" \
              --title "Snapshots: ${{ inputs.city }}" \
              --notes "Scheduled .atlas snapshots. Every published version stays; *-latest.atlas always names the newest." \
              --target "${{ inputs.state-branch }}"
          fi
          cp "out/$FILE" "out/${{ inputs.city }}-latest.atlas"
          gh release upload "$RELEASE" --repo "$GITHUB_REPOSITORY" \
            "out/$FILE" "out/${{ inputs.city }}-latest.atlas#${{ inputs.city }}-latest.atlas" --clobber
          echo "published $FILE"
