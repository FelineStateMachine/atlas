# The release recipe (issue #5 §7, M7).
#
# Two things ship from this repository, and this workflow builds both.
#
#   atlas   the CLI: crawl, tiles, translate, compose, enrich, measure,
#           workbench, serve, dev. Pure Go, CGO_ENABLED=0, cross-compiled for
#           five targets from one runner.
#   Atlas   the desktop application: the hypermedia app in a webview (§3.4).
#           It links a native webview, so it is built and packaged on the
#           platform it runs on. Each package registers .atlas with the OS.
#
# It replaces ci.yml, which built and released the pre-rewrite desktop shell on
# `v*` tags until the old tree was archived at close-out. `v*` answers here
# now. `atlas-v*` is still accepted -- it is the tag the CLI shipped under
# while the desktop host was a TODO in this file -- and means the same thing.
#
# The recipe carried from ci.yml, unchanged where it was already right:
#
#   - version from the tag, `dev-<short sha>` off a tag;
#   - `-trimpath` and `-ldflags "-s -w"`, so a build is a function of its
#     inputs and carries no local paths;
#   - CLI archives remain .tar.gz/.zip; desktop delivery is an application
#     bundle on macOS, a MIME-registering .deb on Linux, and an association-
#     registering Inno Setup installer on Windows;
#   - a release job gated on the tag, `--generate-notes --verify-tag`, and a
#     prerelease when the version carries a hyphen.
#
# The one addition is the seam. `make static` builds render/ and installs the
# bundle where the shell embeds it, so a desktop build runs it first; the CLI
# needs none of that, which is the deletability principle showing up in the
# release recipe.

name: Release

on:
  push:
    tags: ["v*", "atlas-v*"]
  workflow_dispatch:
    inputs:
      version:
        description: "version label for a dispatched build, e.g. v0.1.0"
        required: false
        type: string

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

env:
  GOFLAGS: -trimpath -buildvcs=false

jobs:
  verify:
    name: release acceptance
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: package-lock.json
      - name: Install test dependencies
        run: |
          npm ci --ignore-scripts
          npx playwright install --with-deps chromium
      - name: Required correctness gates
        run: |
          make test
          make test-e2e

  cli:
    name: atlas ${{ matrix.goos }}/${{ matrix.goarch }}
    runs-on: ubuntu-24.04
    env:
      CGO_ENABLED: "0"
    strategy:
      fail-fast: false
      matrix:
        include:
          - { goos: linux, goarch: amd64 }
          - { goos: linux, goarch: arm64 }
          - { goos: darwin, goarch: arm64 }
          - { goos: darwin, goarch: amd64 }
          - { goos: windows, goarch: amd64 }
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - name: Build
        env:
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
        run: |
          VERSION="${GITHUB_REF_NAME#atlas-}"
          if [[ "${GITHUB_REF}" != refs/tags/* ]]; then
            VERSION="${{ inputs.version }}"
            [[ -n "${VERSION}" ]] || VERSION="dev-$(git rev-parse --short HEAD)"
          fi
          # "atlas-cli-", not "atlas-": GitHub release asset names are
          # case-insensitively unique, so a CLI archive spelled "atlas-…"
          # collides with the desktop's "Atlas-…" wherever the two share a
          # platform and an extension — which is exactly how v0.1.0's release
          # job died half-published. The prefix also reads better to a person
          # deciding which file they want.
          NAME="atlas-cli-${VERSION}-${GOOS}-${GOARCH}"
          BINARY="atlas"
          if [[ "${GOOS}" == "windows" ]]; then BINARY="atlas.exe"; fi
          mkdir -p "dist/${NAME}"
          go build -ldflags "-s -w -X main.version=${VERSION}" -o "dist/${NAME}/${BINARY}" ./cmd/atlas
          cp README.md LICENSE "dist/${NAME}/"
          cd dist
          if [[ "${GOOS}" == "windows" ]]; then
            zip -qr "${NAME}.zip" "${NAME}"
          else
            tar -czf "${NAME}.tar.gz" "${NAME}"
          fi

      - uses: actions/upload-artifact@v4
        with:
          name: atlas-${{ matrix.goos }}-${{ matrix.goarch }}
          path: |
            dist/*.tar.gz
            dist/*.zip
          if-no-files-found: error

  desktop:
    name: Atlas ${{ matrix.target }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: linux-amd64
            os: ubuntu-24.04
            tags: "desktop,production,webkit2_41"
            cgo: "1"
          - target: windows-amd64
            os: windows-2025
            tags: "desktop,production"
            cgo: "0"
            # -H windowsgui is what stops a console window opening behind the
            # application.
            ldflags: "-H windowsgui"
          - target: darwin-arm64
            os: macos-15
            tags: "desktop,production"
            cgo: "1"
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: package-lock.json

      # The seam, built and installed where main.go embeds it. Without this
      # step the application still builds and still runs -- it would ship
      # without a viewport, which is the deletability principle rather than an
      # accident -- so the step asserts its own output, to be noticed if it
      # ever silently stops producing one.
      - name: Build the seam into the shell's static tree
        shell: bash
        run: |
          npm ci --ignore-scripts
          npm run --silent seam-build
          mkdir -p dist/static static
          cp render/dist/app.js dist/static/app.js
          cp render/dist/app.js static/app.js
          test -s static/app.js

      - name: Install GTK and WebKitGTK headers
        if: matrix.target == 'linux-amd64'
        run: |
          sudo apt-get update
          sudo apt-get install -y libgtk-3-dev libwebkit2gtk-4.1-dev

      - name: Resolve version
        id: metadata
        shell: bash
        run: |
          VERSION="${GITHUB_REF_NAME#atlas-}"
          if [[ "${GITHUB_REF}" != refs/tags/* ]]; then
            VERSION="${{ inputs.version }}"
            [[ -n "${VERSION}" ]] || VERSION="dev-$(git rev-parse --short HEAD)"
          fi
          echo "version=${VERSION}" >> "$GITHUB_OUTPUT"

      - name: Build native desktop binary
        shell: bash
        env:
          CGO_ENABLED: ${{ matrix.cgo }}
        run: |
          BINARY="Atlas"
          if [[ "${{ matrix.target }}" == windows-* ]]; then BINARY="Atlas.exe"; fi
          go build -tags "${{ matrix.tags }}" \
            -ldflags "-s -w -X main.version=${{ steps.metadata.outputs.version }} ${{ matrix.ldflags }}" -o "${BINARY}" .

      - name: Sign Windows application when credentials are configured
        if: matrix.target == 'windows-amd64'
        shell: pwsh
        env:
          WINDOWS_CERTIFICATE_BASE64: ${{ secrets.WINDOWS_CERTIFICATE_BASE64 }}
          WINDOWS_CERTIFICATE_PASSWORD: ${{ secrets.WINDOWS_CERTIFICATE_PASSWORD }}
        run: ./scripts/release/sign-windows.ps1 -Path Atlas.exe

      - name: Package macOS application
        if: matrix.target == 'darwin-arm64'
        shell: bash
        env:
          MACOS_CERTIFICATE_P12_BASE64: ${{ secrets.MACOS_CERTIFICATE_P12_BASE64 }}
          MACOS_CERTIFICATE_PASSWORD: ${{ secrets.MACOS_CERTIFICATE_PASSWORD }}
          MACOS_SIGNING_IDENTITY: ${{ secrets.MACOS_SIGNING_IDENTITY }}
          MACOS_NOTARY_KEY_BASE64: ${{ secrets.MACOS_NOTARY_KEY_BASE64 }}
          MACOS_NOTARY_KEY_ID: ${{ secrets.MACOS_NOTARY_KEY_ID }}
          MACOS_NOTARY_ISSUER_ID: ${{ secrets.MACOS_NOTARY_ISSUER_ID }}
        run: ./scripts/release/package-desktop.sh darwin-arm64 "${{ steps.metadata.outputs.version }}" Atlas dist

      - name: Package Linux application
        if: matrix.target == 'linux-amd64'
        shell: bash
        run: ./scripts/release/package-desktop.sh linux-amd64 "${{ steps.metadata.outputs.version }}" Atlas dist

      - name: Package Windows installer
        if: matrix.target == 'windows-amd64'
        shell: pwsh
        run: ./scripts/release/package-windows.ps1 -Version "${{ steps.metadata.outputs.version }}" -Binary "${{ github.workspace }}\Atlas.exe" -Dist "${{ github.workspace }}\dist"

      - name: Sign Windows installer when credentials are configured
        if: matrix.target == 'windows-amd64'
        shell: pwsh
        env:
          WINDOWS_CERTIFICATE_BASE64: ${{ secrets.WINDOWS_CERTIFICATE_BASE64 }}
          WINDOWS_CERTIFICATE_PASSWORD: ${{ secrets.WINDOWS_CERTIFICATE_PASSWORD }}
        run: ./scripts/release/sign-windows.ps1 -Path "dist/Atlas-${{ steps.metadata.outputs.version }}-windows-amd64-setup.exe"

      - name: Smoke Windows install and .atlas association
        if: matrix.target == 'windows-amd64'
        shell: pwsh
        run: |
          $installer = "dist/Atlas-${{ steps.metadata.outputs.version }}-windows-amd64-setup.exe"
          & $installer /VERYSILENT /SUPPRESSMSGBOXES /NORESTART /CURRENTUSER
          if ($LASTEXITCODE -ne 0) { throw "installer exited $LASTEXITCODE" }
          $association = (Get-Item "HKCU:\Software\Classes\.atlas").GetValue("")
          if ($association -ne "Atlas.Volume") { throw "unexpected .atlas association: $association" }
          $command = (Get-Item "HKCU:\Software\Classes\Atlas.Volume\shell\open\command").GetValue("")
          if ($command -notmatch 'Atlas\.exe.*%1') { throw "unexpected open command: $command" }

      - uses: actions/upload-artifact@v4
        with:
          name: Atlas-${{ matrix.target }}
          path: |
            dist/*.deb
            dist/*.exe
            dist/*.tar.gz
            dist/*.zip
          if-no-files-found: error

  release:
    if: startsWith(github.ref, 'refs/tags/')
    needs: [verify, cli, desktop]
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v5
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      - name: Verify the exact asset set and smoke the packaged CLI
        run: |
          VERSION="${GITHUB_REF_NAME#atlas-}"
          scripts/release/verify-assets.sh dist "$VERSION"
          scripts/release/package-smoke.sh dist "$VERSION" "$GITHUB_WORKSPACE"

      - name: Publish a complete release transaction
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # A hyphen in the version itself -- v0.2.0-rc1 -- is a prerelease.
          VERSION="${GITHUB_REF_NAME#atlas-}"
          PRERELEASE=""
          if [[ "${VERSION#v}" == *-* ]]; then PRERELEASE="--prerelease"; fi
          gh release create "${GITHUB_REF_NAME}" \
            --title "Atlas ${VERSION}" \
            --generate-notes --verify-tag --draft ${PRERELEASE}
          gh release upload "${GITHUB_REF_NAME}" dist/*

          mapfile -t LOCAL < <(find dist -maxdepth 1 -type f -printf '%f\n' | sort)
          mapfile -t REMOTE < <(gh release view "${GITHUB_REF_NAME}" --json assets --jq '.assets[].name' | sort)
          [[ "${#LOCAL[@]}" -eq 9 && "${#REMOTE[@]}" -eq 9 ]]
          diff -u <(printf '%s\n' "${LOCAL[@]}") <(printf '%s\n' "${REMOTE[@]}")

          while read -r CHECKSUM NAME; do
            REMOTE_DIGEST="$(gh api "repos/${GITHUB_REPOSITORY}/releases/tags/${GITHUB_REF_NAME}" \
              --jq ".assets[] | select(.name == \"${NAME}\") | .digest")"
            [[ "${REMOTE_DIGEST}" == "sha256:${CHECKSUM}" ]] || {
              printf 'remote digest mismatch for %s: wanted sha256:%s, got %s\n' \
                "${NAME}" "${CHECKSUM}" "${REMOTE_DIGEST}" >&2
              exit 1
            }
          done < dist/SHA256SUMS
          CHECKSUM="$(sha256sum dist/SHA256SUMS | cut -d ' ' -f 1)"
          REMOTE_DIGEST="$(gh api "repos/${GITHUB_REPOSITORY}/releases/tags/${GITHUB_REF_NAME}" \
            --jq '.assets[] | select(.name == "SHA256SUMS") | .digest')"
          [[ "${REMOTE_DIGEST}" == "sha256:${CHECKSUM}" ]]
          gh release edit "${GITHUB_REF_NAME}" --draft=false
