# The scheduler over the public proof cities: the living test of the same
# reusable workflow a city IT team points at their own city with their own
# zone reports; see docs/snapshots.md for that setup.
#
# The weekly cron is parked (issue #5 §7, M7). snapshot.yml's first step is
# `atlas crawl -source arcgis-hub`, and that crawler is the one the rewrite has
# not built; a scheduled run would fail every Monday and teach nobody anything.
# The trigger below is dispatch-only until the crawler lands, and the cron it
# is waiting to become is:
#
#   schedule:
#     - cron: "17 6 * * 1"
name: Snapshots

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  city:
    strategy:
      fail-fast: false
      matrix:
        city: [bend-or, redondo-beach-ca]
    uses: ./.github/workflows/snapshot.yml
    with:
      city: ${{ matrix.city }}
