# The enforcement job (issue #5 §6, §9).
#
# Deliberately separate from release.yml, which links a native webview and so
# needs GTK and WebKitGTK headers on Linux, a macOS runner for the .app, and
# the seam built first. This one judges correctness and needs none of that; it
# has stayed green from the day the harness landed, because a gate whose lane
# did not exist yet skipped and said which milestone it was waiting on.
#
# It needs Go, and node with the TypeScript lanes' own dependencies: the
# analysis gates re-execute the cell systems against every recorded vector and
# plan, and then hold both lanes to their boundary rules, type checker, tests
# and conformance suite. Node strips the TypeScript types on import. No browser
# is involved and no bundle is built.
#
# It runs on all three platforms (§7, M7). The harness compares bytes for a
# living — fixtures against captures, generated artifacts against committed
# ones — so a platform that rewrote a line ending or built a path with the
# wrong separator is caught here rather than by a user. `/.gitattributes` is
# the other half of that: LF in every working tree, fixtures never transformed
# at all.

name: Golden

on:
  push:
    branches:
      - main
      - "m[0-9]/**"
      - "cleanroom/**"
  pull_request:

permissions:
  contents: read

concurrency:
  group: golden-${{ github.ref }}
  cancel-in-progress: true

env:
  GOFLAGS: -buildvcs=false

jobs:
  harness:
    name: harness (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      # One platform's failure is a finding about that platform, not a reason
      # to stop learning what the other two think.
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, macos-15, windows-2022]
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - uses: actions/setup-node@v4
        with:
          # Type stripping is on by default here, which is what lets the gate
          # import the analysis lane's TypeScript with no build step.
          node-version: "24"
          cache: npm
          cache-dependency-path: package-lock.json

      # The clean-room TypeScript lanes install at the repository root as npm
      # workspaces: s2js for the analysis lane, eslint and tsc for its gate.
      # `--ignore-scripts` because nothing here has a postinstall worth running.
      - name: Install the TypeScript lanes' dependencies
        run: npm ci --ignore-scripts

      # A checkout that rewrote line endings would fail the byte comparisons
      # below with an unreadable diff. Say so here instead, in one line.
      - name: Confirm the working tree came through unmodified
        run: git diff --exit-code

      # The guardrails are tested like anything else: the import matrix is a
      # pure function of two package paths, and its table lives here.
      - name: Test the harness itself
        run: go test ./golden/...

      # What `make golden` runs, spelled out because the Windows runner has no
      # make. One entrypoint, the same gates in the same order, on all three
      # platforms. It prints the waiver file on every run: an accepted
      # divergence from a golden is a standing cost, not a silent one.
      - name: Run the golden gates
        run: go run ./golden/harness
