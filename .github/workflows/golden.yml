# The clean-room rewrite's enforcement job (issue #5 §6, §9).
#
# Deliberately separate from CI: that workflow builds and ships the current
# desktop app, which needs GTK and WebKitGTK headers and the whole frontend
# toolchain. This one judges the rewrite and stays green from the day the
# harness lands — the gates whose lane does not exist yet skip, and the four
# that run (depcheck, format-roundtrip, analysis-vectors, analysis-lane) run
# for real.
#
# It needs Go, and node with the analysis lane's own dependency: the analysis
# gates re-execute the cell systems against every recorded vector and plan and
# then hold the lane to its own boundary rules, type checker and conformance
# suite. Since M6 the implementation being driven is `analysis/cellsystems`,
# whose whole dependency surface is s2js, and whose TypeScript node strips on
# import. No browser is involved and no bundle is built.

name: Golden

on:
  push:
    branches:
      - main
      - "m[0-9]/**"
      - "cleanroom/**"
  pull_request:

permissions:
  contents: read

concurrency:
  group: golden-${{ github.ref }}
  cancel-in-progress: true

env:
  GOFLAGS: -buildvcs=false

jobs:
  harness:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - uses: actions/setup-node@v4
        with:
          # Type stripping is on by default here, which is what lets the gate
          # import the analysis lane's TypeScript with no build step.
          node-version: "24"
          cache: npm
          cache-dependency-path: package-lock.json

      # The clean-room TypeScript lanes install at the repository root as npm
      # workspaces: s2js for the analysis lane, eslint and tsc for its gate.
      # `--ignore-scripts` because nothing here has a postinstall worth running.
      - name: Install the analysis lane's dependencies
        run: npm ci --ignore-scripts

      # The guardrails are tested like anything else: the import matrix is a
      # pure function of two package paths, and its table lives here.
      - name: Test the harness itself
        run: go test ./golden/...

      # One entrypoint, same one a developer runs locally with `make golden`.
      # Prints the waiver file on every run: an accepted divergence from a
      # golden is a standing cost, not a silent one.
      - name: Run the golden gates
        run: make golden
