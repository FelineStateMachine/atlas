<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="color-scheme" content="dark">
  <link rel="icon" href="data:,">
  <title>Atlas — Game Map Explorer</title>
  <link rel="stylesheet" href="/static/app.css">
  <script src="/static/app.js" defer></script>
</head>
<body>
  <div class="app-shell">
    <header class="topbar">
      <div class="brand" aria-label="Atlas">
        <span class="brand-mark" aria-hidden="true">
          <svg viewBox="0 0 32 32"><path d="M16 2 27 8.5v15L16 30 5 23.5v-15L16 2Z"/><path d="m10 20 4-10 3 7 2-4 3 7"/></svg>
        </span>
        <span>
          <strong>ATLAS</strong>
          <small>Game map explorer</small>
        </span>
      </div>

      <div class="map-pickers">
        <label>
          <span>Game</span>
          <select id="game-select" aria-label="Game"></select>
        </label>
        <label>
          <span>Map</span>
          <select id="map-select" aria-label="Map"></select>
        </label>
        <label id="variant-field">
          <span>Layer</span>
          <select id="variant-select" aria-label="Map layer"></select>
        </label>
      </div>

      <button class="icon-button mobile-legend" id="mobile-legend" type="button" aria-label="Toggle legend" aria-expanded="false">
        <svg viewBox="0 0 24 24"><path d="M4 6h16M4 12h16M4 18h16"/></svg>
      </button>
    </header>

    <aside class="sidebar" id="sidebar">
      <section class="sidebar-heading">
        <p class="eyebrow">EXPLORE</p>
        <h1 id="game-title">Loading games…</h1>
        <p id="map-title" class="map-name">Preparing map</p>
        <p id="map-meta">Preparing embedded archive</p>
      </section>

      <div class="search-wrap">
        <svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="11" cy="11" r="6"/><path d="m16 16 4 4"/></svg>
        <input id="pin-search" type="search" placeholder="Search locations" autocomplete="off" aria-label="Search locations">
        <kbd>⌘K</kbd>
      </div>
      <div id="search-results" class="search-results" hidden></div>

      <div class="legend-toolbar">
        <span>Layers</span>
        <button id="solo-chip" class="solo-chip" type="button" hidden></button>
        <div>
          <button id="show-all" type="button">Show all</button>
          <span aria-hidden="true">·</span>
          <button id="hide-all" type="button">Hide all</button>
        </div>
      </div>

      <div id="layers" class="layers">
        <section id="zone-index" class="layer-section" hidden>
          <div class="layer-header">
            <button class="layer-title" type="button" data-section="zones" aria-expanded="true">
              <span class="layer-chevron" aria-hidden="true">
                <svg viewBox="0 0 24 24"><path d="m9 6 6 6-6 6"/></svg>
              </span>
              <span>Zones</span>
              <span id="zone-count" class="layer-count"></span>
            </button>
            <label class="layer-switch">
              <input id="zone-toggle" type="checkbox" aria-label="Show zone boundaries" checked>
              <span aria-hidden="true"></span>
            </label>
          </div>
          <div id="zone-list" class="zone-list"></div>
        </section>

        <div id="legend" class="legend"></div>
      </div>

      <footer class="sidebar-footer">
        <span class="live-dot"></span>
        <span id="visible-count">0 locations visible</span>
      </footer>
    </aside>

    <main class="map-panel">
      <div id="map" class="map" tabindex="0" autofocus aria-label="Interactive game map">
        <div class="map-loading" id="map-loading">
          <span class="spinner"></span>
          <strong>Unfolding map</strong>
          <small>Loading visible embedded tiles…</small>
        </div>

        <div class="zoom-controls" aria-label="Map controls">
          <button id="zoom-in" type="button" aria-label="Zoom in">+</button>
          <button id="zoom-out" type="button" aria-label="Zoom out">−</button>
        </div>

        <div id="grid-navigator" class="grid-navigator" hidden>
          <button id="grid-back" type="button" aria-label="Back one geohash level">←</button>
          <label>
            <span>Geohash</span>
            <input id="grid-input" type="text" inputmode="text" autocomplete="off"
              autocapitalize="none" spellcheck="false" aria-label="Geohash">
          </label>
        </div>

        <div id="overview" class="overview" hidden aria-label="Map overview">
          <canvas id="overview-canvas"></canvas>
          <div id="overview-viewport" class="overview-viewport"></div>
        </div>

        <div class="map-hint" id="map-hint">
          <span>Drag to pan</span><i></i><span>Scroll to zoom</span><i></i>
          <span id="labels-hint">Z · labels off</span><i></i>
          <span id="grid-hint">G · grid off</span>
        </div>

        <article id="pin-detail" class="pin-detail" hidden>
          <button id="close-detail" class="detail-close" type="button" aria-label="Close location details">×</button>
          <div class="detail-category">
            <span id="detail-dot"></span>
            <span id="detail-category"></span>
          </div>
          <h2 id="detail-title"></h2>
          <p id="detail-description"></p>
          <nav id="detail-links" class="detail-links" hidden></nav>
          <dl>
            <div><dt>Location ID</dt><dd id="detail-id"></dd></div>
            <div><dt>Coordinates</dt><dd id="detail-coordinates"></dd></div>
          </dl>
        </article>
      </div>
    </main>
  </div>

  <div id="fatal-error" class="fatal-error" hidden>
    <strong>Atlas could not open the embedded catalog.</strong>
    <p id="fatal-message"></p>
  </div>
</body>
</html>
